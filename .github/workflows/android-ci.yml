name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust for native content filtering
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Verify browser regression guards
        run: node tools/verify_all.js

      - name: Verify Brave content-filtering library
        run: cargo test --manifest-path app/src/main/rust/Cargo.toml --release

      - name: Build Brave content-filtering library for ARM
        shell: bash
        run: |
          sdkmanager "ndk;27.1.12297006"
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          cd app/src/main/rust
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../jniLibs build --release
          test -s ../jniLibs/arm64-v8a/libhttps_browser_adblock.so
          test -s ../jniLibs/armeabi-v7a/libhttps_browser_adblock.so

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HTTPS_BROWSER_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/https-browser-release.p12"

      - name: Build, unit test and lint
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/https-browser-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.HTTPS_BROWSER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HTTPS_BROWSER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HTTPS_BROWSER_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease

      - name: Upload signed release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTTPS-Tab-Browser-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          # 手動CIを連続実行しても無料枠を圧迫しないよう、配布確認に必要な期間だけ保管する。
          retention-days: 3

      - name: Upload lint reports when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          # 失敗調査用レポートも同じ短期保持とし、古い実行だけが自動的に期限切れになるようにする。
          retention-days: 3
