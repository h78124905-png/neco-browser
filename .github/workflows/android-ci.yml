name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify Android app
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package is no longer available.
          packages: platform-tools

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HTTPS_BROWSER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/https-browser-release.p12"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.HTTPS_BROWSER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HTTPS_BROWSER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HTTPS_BROWSER_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ -s "$RUNNER_TEMP/https-browser-release.p12" ]; then
            export KEYSTORE_FILE="$RUNNER_TEMP/https-browser-release.p12"
          else
            unset KEYSTORE_FILE
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease
          else
            ./gradlew --no-daemon assembleRelease
          fi

      - name: Upload signed release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTTPS-Tab-Browser-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload build reports when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 3
